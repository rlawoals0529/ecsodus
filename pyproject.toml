[project]
name = "ecsodus"
version = "0.1.2"
description = "Safely migrate AWS Copilot CLI apps to Terraform-managed ECS (adopt in place, retain-patched teardown)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vamshidher Reddy Jannapu Reddy" }]
keywords = ["aws", "aws-copilot", "copilot-cli", "copilot cli deprecated", "copilot end of support", "ecs", "amazon-ecs", "terraform", "terraform import", "migration", "cloudformation", "app-runner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "boto3>=1.34",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
  "markdown>=3.11",
]

[project.urls]
Homepage = "https://moneytool.github.io/ecsodus/"
Documentation = "https://moneytool.github.io/ecsodus/"
Source = "https://github.com/moneytool/ecsodus"
DOI = "https://doi.org/10.5281/zenodo.23073590"
Issues = "https://github.com/moneytool/ecsodus/issues"
Changelog = "https://github.com/moneytool/ecsodus/blob/main/CHANGELOG.md"

[project.scripts]
ecsodus = "ecsodus.cli:main"

[dependency-groups]
dev = ["pytest>=8", "moto[all]>=5", "ruff>=0.6", "mypy>=1.11", "boto3-stubs[cloudformation,ecs,elbv2,route53,acm,rds,dynamodb,ec2,ssm,sts]"]

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Runbook and inventory messages are shell commands and prose; wrapping them hurts readability.
"src/ecsodus/emit/runbook.py" = ["E501"]
"src/ecsodus/sources/copilot.py" = ["E501"]
"src/ecsodus/knowledge.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["terraform: needs the terraform binary"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
